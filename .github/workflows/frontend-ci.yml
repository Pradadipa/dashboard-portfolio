name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

# A new push to the same branch/PR cancels the older, now-useless run (saves free minutes).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same major as frontend/Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if it disagrees with
      # package.json (unlike `npm install`, which may quietly rewrite the lock file).
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`: type-check first (strict mode), then bundle.
      # If a type error slips in, the build fails here instead of when the Docker image is built.
      - name: Type-check and build
        run: npm run build
