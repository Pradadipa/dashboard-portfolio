# Host nginx (on the VPS, outside Docker) -> compose frontend on 127.0.0.1:8080.
# Install: copy to /etc/nginx/sites-available/dashboard, replace dashboard.example.com,
# then `sudo certbot --nginx -d <domain>` adds the 443 server block and the
# HTTP -> HTTPS redirect to this file. See docs/deploy-vps.md.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
