[project]
name = "backend"
version = "0.1.0"
description = "Business Dashboard API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
# src/backend is a stray uv scaffold package, not part of the real app (app/). Notebooks are git-ignored scratch.
extend-exclude = ["src", "*.ipynb"]

[tool.ruff.lint]
# Start with pyflakes (F) + pycodestyle errors that point at real bugs.
# Add more rules later ("I" import sorting, "B" bugbear, ...) once the code is clean.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# WIP: customer summary is not wired to a router yet. Delete these two lines when it is finished.
"app/schemas/customer.py" = ["F401"]
"app/services/customer_service.py" = ["F401", "F841"]

[tool.pytest.ini_options]
# Only look in tests/. test_db.py and test_service.py in this folder are manual scripts
# (they need real data), not pytest tests.
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# ONE event loop for the whole run: app/db/session.py creates a single global async engine
# (connection pool), and asyncpg connections cannot move between event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
